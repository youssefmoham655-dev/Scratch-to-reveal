<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to reveal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="warning" id="warning">
        <div class="child">
            <h1 class="warningh1">Scratch to reveal</h1>
            <p class="warningp">You should scratch this black screen to see the secret image behind this black screen</p>
            <p class="warningp">Have fun</p>
        </div>
        <div class="child2">
            <button id="go-button">let's go</button>
        </div>
    </div>
    <div class="container" id="container">
        <div class="secret_item" id="secret_item">
            <img src="assets/secet (11).jpg" alt="secret" id="secret_image">
        </div>
        <canvas id="scratch_canvas"></canvas>
    </div>
    <div class="controls">
        <button id="next">→</button>
        <div class="brush-controls">
            <input type="range" id="brush_slider" min="10" max="90" value="35">
            <span id="brush-size-val">30px</span>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
